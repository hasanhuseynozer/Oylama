name: Install site statistics endpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-site-stats.yml

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Worker statistics API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/index.js')
          source = path.read_text(encoding='utf-8')

          if '/api/site-stats' in source:
              print('Statistics endpoint already installed.')
              raise SystemExit(0)

          asset_needle = '''      if(request.method==="GET"&&url.pathname.startsWith("/sunucular/"))return secureResponse(await serverPageResponse(request,env,url));

      const response = await env.ASSETS.fetch(request);'''
          asset_replacement = '''      if(request.method==="GET"&&url.pathname.startsWith("/sunucular/"))return secureResponse(await serverPageResponse(request,env,url));
      if(request.method==="GET"&&url.pathname==="/")await recordDailyVisit(request,env);

      const response = await env.ASSETS.fetch(request);'''
          if asset_needle not in source:
              raise SystemExit('Asset insertion point was not found.')
          source = source.replace(asset_needle, asset_replacement, 1)

          api_needle = '''  const method = request.method.toUpperCase();
  const path = url.pathname;

  if (method === "GET" && path === "/api/config") {'''
          api_replacement = '''  const method = request.method.toUpperCase();
  const path = url.pathname;

  if(method==="GET"&&path==="/api/site-stats")return json(await getSiteStats(env.DB));

  if (method === "GET" && path === "/api/config") {'''
          if api_needle not in source:
              raise SystemExit('API insertion point was not found.')
          source = source.replace(api_needle, api_replacement, 1)

          function_needle = '\nasync function handleApi(request, env, url) {'
          function_block = r'''
async function ensureVisitStatsTable(db){
  await db.prepare(`CREATE TABLE IF NOT EXISTS site_daily_visits(
    day TEXT NOT NULL,
    visitor_hash TEXT NOT NULL,
    visits INTEGER NOT NULL DEFAULT 1,
    updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
    PRIMARY KEY(day,visitor_hash)
  )`).run();
}

async function recordDailyVisit(request,env){
  try{
    await ensureVisitStatsTable(env.DB);
    const day=new Date().toISOString().slice(0,10);
    const ip=request.headers.get("cf-connecting-ip")||"unknown";
    const agent=(request.headers.get("user-agent")||"unknown").slice(0,160);
    const visitorHash=await keyedHash(env,`${day}|${ip}|${agent}`);
    await env.DB.prepare(`INSERT INTO site_daily_visits(day,visitor_hash,visits,updated_at)
      VALUES(?,?,1,CURRENT_TIMESTAMP)
      ON CONFLICT(day,visitor_hash) DO UPDATE SET visits=site_daily_visits.visits+1,updated_at=CURRENT_TIMESTAMP`)
      .bind(day,visitorHash).run();
  }catch(error){
    console.error("Daily visit tracking failed",error);
  }
}

async function getSiteStats(db){
  await ensureVisitStatsTable(db);
  const stats=await db.prepare(`SELECT
    (SELECT COUNT(*) FROM site_daily_visits WHERE day=date('now')) daily_visits,
    (SELECT COUNT(*) FROM reviews r WHERE NOT EXISTS(SELECT 1 FROM hidden_reviews h WHERE h.review_id=r.id)) total_votes,
    (SELECT COUNT(*) FROM servers WHERE is_active=1) total_servers,
    (SELECT COUNT(*) FROM servers WHERE is_active=1 AND operational_status='online') online_servers,
    (SELECT COUNT(*) FROM users WHERE status='active') total_users`).first();
  return {
    dailyVisits:Number(stats?.daily_visits||0),
    totalVotes:Number(stats?.total_votes||0),
    totalServers:Number(stats?.total_servers||0),
    onlineServers:Number(stats?.online_servers||0),
    totalUsers:Number(stats?.total_users||0)
  };
}
'''
          if function_needle not in source:
              raise SystemExit('Function insertion point was not found.')
          source = source.replace(function_needle, function_block + function_needle, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit Worker statistics API
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "SRO Rating Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.js
          git commit -m "Add daily visit and public site statistics API"
          git push
