<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kayıt Ol — SRO RATING</title>
  <link rel="icon" href="/sro-rating-logo-v2.png">
  <link rel="stylesheet" href="/styles.css?v=20260728-12">
  <link rel="stylesheet" href="/project-aqua-components-v1.css?v=20260730-2230">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body class="auth-page">
<main class="auth-card auth-card-wide">
  <a href="/"><img class="auth-logo" src="/sro-rating-logo-v2.png" alt="SRO RATING"></a>
  <p class="eyebrow">TOPLULUĞA KATIL</p>
  <h1>Hesabını Oluştur</h1>
  <p class="panel-lead">Önce normal hesabını oluştur. Yayıncı olmak istersen giriş yaptıktan sonra ana menüden başvurabilirsin.</p>
  <form id="authForm" data-mode="register">
    <div class="auth-grid">
      <label>Kullanıcı adı<input id="displayName" required minlength="2" maxlength="40" autocomplete="nickname"></label>
      <label>E-posta<input id="email" type="email" required autocomplete="email"></label>
      <label>Şifre<input id="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <label>Şifre doğrulama<input id="passwordConfirm" type="password" required minlength="8" autocomplete="new-password"></label>
    </div>
    <input type="hidden" name="accountType" value="user">
    <div class="password-guide"><strong>Şifre kuralları</strong><span>✓ En az 8 karakter</span><span>✓ En az bir harf ve rakam</span><span>✓ İki şifre aynı olmalı</span></div>
    <div id="turnstile"></div>
    <button class="primary" type="submit">Hesabımı Oluştur</button>
    <p id="authMessage"></p>
  </form>
  <div class="auth-links"><a href="/">Ana sayfa</a><a href="/giris/">Giriş Yap</a></div>
</main>
<script src="/auth.js?v=20260728-36" defer></script>
</body>
</html>
